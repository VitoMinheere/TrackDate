{{define "edit_trackday.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit track day · Trackdate</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<div class="topbar">
<h1><a href="/app">Trackdate</a></h1>
<form method="post" action="/logout"><button class="secondary" type="submit">Log out</button></form>
</div>

<h2>Edit track day</h2>
<form class="stack" method="post" action="/app/trackdays/{{.Day.ID}}/update">
<label for="date">Date</label>
<input id="date" type="date" name="date" value="{{.Day.Date}}" required>
<label for="track">Track</label>
<input id="track" type="text" name="track" value="{{.Day.Track}}" required>
<label for="organization">Organization</label>
<input id="organization" type="text" name="organization" value="{{.Day.Organization}}" required>
<label for="cost">Cost</label>
<input id="cost" type="text" inputmode="decimal" name="cost" value="{{.CostInput}}">
<div class="row-actions">
<button type="submit">Save</button>
<a href="/app"><button class="secondary" type="button">Cancel</button></a>
</div>
</form>
</main>
</body>
</html>
{{end}}
