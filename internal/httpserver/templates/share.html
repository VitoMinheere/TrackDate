{{define "share.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track days · Trackdate</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<h1>Track days</h1>
<p class="muted">Read-only, shared via Trackdate.</p>
{{if .TrackDays}}
<table>
<thead><tr><th>Date</th><th>Track</th><th>Organization</th><th>Cost</th></tr></thead>
<tbody>
{{range .TrackDays}}
<tr>
<td>{{.Date}}</td>
<td>{{.Track}}</td>
<td>{{.Organization}}</td>
<td>{{.Cost}}</td>
</tr>
{{end}}
</tbody>
</table>
{{else}}
<p class="muted">No track days yet.</p>
{{end}}
</main>
</body>
</html>
{{end}}
